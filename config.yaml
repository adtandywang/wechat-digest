# =============================================================
# WeChat Digest - Configuration
# =============================================================
# 44 WeChat Public Accounts
#
# HOW TO FIND RSS FEEDS:
# -------------------------------------------
# 1. feeddd.org (FREE) - Visit https://feeddd.org/feed/list
# 2. RSSHub (FREE, self-host) - https://github.com/DIYgod/RSSHub
# 3. WeRSS (werss.app, PAID) - Most reliable
#
# QUICK SETUP:
#   python setup_feeds.py
#   (extracts biz_id from sample URLs, prints RSSHub feed URLs)
#   Then copy the URLs into this file manually.
#
#   WARNING: Do NOT run setup_feeds.py --auto. PyYAML's dump
#   will destroy all comments and formatting in this file.
#   Use the --dry-run output and paste URLs by hand.
# =============================================================

report_periods:
  - 1
  - 7
  - 30

language: zh

max_articles_per_account: 50

request:
  timeout: 30
  retry_count: 3
  retry_delay: 5
  user_agent: "Mozilla/5.0 (compatible; WeChatDigest/1.0)"

output:
  directory: "output"
  keep_history: false    # Don't generate timestamped copies (prevents git bloat)
  max_history_days: 90

